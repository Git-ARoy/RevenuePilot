version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revenuepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revenuepilot}
      POSTGRES_DB: ${POSTGRES_DB:-revenuepilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revenuepilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-revenuepilot}:${POSTGRES_PASSWORD:-revenuepilot}@db:5432/${POSTGRES_DB:-revenuepilot}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-revenuepilot}:${POSTGRES_PASSWORD:-revenuepilot}@db:5432/${POSTGRES_DB:-revenuepilot}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    command: pnpm dev

volumes:
  postgres_data:
